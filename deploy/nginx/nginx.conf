# =============================================================================
# InternalChat edge reverse proxy.
#
# Constitution v1.2.0, Security Requirements:
#   - CSP with no unsafe-inline and no unsafe-eval, HSTS, nosniff,
#     Referrer-Policy, X-Frame-Options: DENY, explicit CORS allow-list (T044)
#   - TLS 1.3 (1.2 minimum); plaintext HTTP is REFUSED, not redirected, for API
#     routes; internal-only attachment location (T051)
#
# Attachment bytes are the reason this file matters as much as it does.
# FR-025 requires a membership check on EVERY retrieval, and videos reach
# 500 MB. Presigned URLs would fail the requirement (a presigned URL is a bearer
# capability — anyone holding it gets the file), and streaming through Kestrel
# would consume request threads the messaging p95 budget depends on. So the API
# authorises, then hands the transfer here via X-Accel-Redirect into a location
# nginx will only enter internally. See research.md D7.
# =============================================================================

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # WebSocket upgrade for SignalR. Without this the hub silently falls back to
    # long polling and the 500 ms delivery budget stops being achievable.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------------
    # CORS allow-list. Wildcard origins are prohibited by the constitution, so
    # an unlisted origin maps to the empty string and no CORS header is emitted
    # at all — the browser then refuses the response, which is the intent.
    # ------------------------------------------------------------------------
    map $http_origin $cors_origin {
        default                "";
        "~^https?://localhost(:[0-9]+)?$"  $http_origin;
        "~^https://internalchat\.[a-z0-9.-]+$" $http_origin;
    }

    # ------------------------------------------------------------------------
    # Rate limiting at the edge, in front of the application's own limits
    # (T043). Two layers on purpose: this one survives an application that is
    # already saturated, which is exactly when it is needed.
    # ------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth_limit:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:20m    rate=600r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 500 MB video uploads (FR-023). Kestrel never sees these bytes.
    client_max_body_size 512m;
    client_body_timeout  300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ------------------------------------------------------------------------
    # TLS. 1.3 preferred, 1.2 minimum — nothing older is offered.
    # Certificates are free: Let's Encrypt in production, a locally generated
    # development CA in Compose (Principle VIII — a purchased certificate is
    # neither required nor permitted as a dependency).
    # ------------------------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    upstream internalchat_web {
        server web:8080;
        keepalive 16;
    }

    upstream internalchat_api {
        server api:8080;
        keepalive 32;
    }

    upstream internalchat_objects {
        server minio:9000;
        keepalive 16;
    }

    # -------------------------------------------------------------------------
    # Web app
    # -------------------------------------------------------------------------
    server {
        listen 8080;
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/internalchat.crt;
        ssl_certificate_key /etc/nginx/certs/internalchat.key;

        # `always` so the headers are present on error responses too — a 500 that
        # loses its CSP is a 500 that can be turned into something worse.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

        # No unsafe-inline, no unsafe-eval (constitution, Application Controls).
        # connect-src covers wss: because SignalR runs over WebSockets; without it
        # the hub is blocked and real-time delivery silently degrades.
        # media-src blob: is required for inline video playback (FR-022).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://internalchat_web;
        }
    }

    # -------------------------------------------------------------------------
    # API
    # -------------------------------------------------------------------------
    server {
        listen 8081;
        listen 8444 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/internalchat.crt;
        ssl_certificate_key /etc/nginx/certs/internalchat.key;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;

        limit_conn conn_limit 100;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        # Authentication endpoints are rate limited hardest: they are the
        # credential-stuffing surface.
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://internalchat_api;
            include /etc/nginx/cors.inc;
        }

        location /api/v1/conversations/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://internalchat_api;
            include /etc/nginx/cors.inc;
        }

        # SignalR hub. Buffering off and a long read timeout, or the connection
        # is torn down between messages on an idle conversation.
        location /hubs/ {
            proxy_pass http://internalchat_api;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://internalchat_api;
            include /etc/nginx/cors.inc;
        }

        # ---------------------------------------------------------------------
        # Attachment byte transfer (FR-025, research.md D7).
        #
        # `internal` is the entire security control: nginx refuses to serve this
        # location for a client request. It is reachable only when the API has
        # already performed the membership check and answered with
        # X-Accel-Redirect. A client asking for /internal-attachments/... directly
        # gets 404.
        #
        # Range requests pass through so video playback starts without
        # downloading the whole file (FR-022).
        # ---------------------------------------------------------------------
        location /internal-attachments/ {
            internal;

            proxy_pass http://internalchat_objects/;
            proxy_set_header Authorization "";
            proxy_pass_request_headers off;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_buffering off;
            proxy_read_timeout 300s;

            # Attachments are confidential and per-user authorised. A shared cache
            # holding one would serve it to whoever asked next.
            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options "nosniff" always;

            # Never rendered inline — an HTML or SVG attachment rendered in the
            # app's origin would be stored XSS.
            add_header Content-Disposition "attachment" always;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
