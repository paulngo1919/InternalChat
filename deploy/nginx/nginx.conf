# =============================================================================
# InternalChat edge reverse proxy.
#
#   >>> INCOMPLETE BY DESIGN. Created by T011 so the Compose stack boots. <<<
#
#   T044 adds: CSP without unsafe-inline/unsafe-eval, HSTS, X-Content-Type-Options,
#              Referrer-Policy, X-Frame-Options: DENY, and the CORS allow-list.
#   T051 adds: TLS 1.3 termination and the internal-only attachment location that
#              serves MinIO bytes via X-Accel-Redirect after the API has checked
#              conversation membership (research.md D7, FR-025).
#
#   Until both land this is an HTTP-only development edge. Do not deploy it.
# =============================================================================

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # WebSocket upgrade for SignalR. Without this the hub silently falls back to
    # long polling and the 500 ms delivery budget stops being achievable.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # 500 MB video uploads (FR-023). Kestrel never sees these bytes.
    client_max_body_size 512m;
    client_body_timeout  300s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    upstream internalchat_web {
        server web:8080;
        keepalive 16;
    }

    upstream internalchat_api {
        server api:8080;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Web app — http://localhost:8080
    # -------------------------------------------------------------------------
    server {
        listen 8080;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://internalchat_web;
        }
    }

    # -------------------------------------------------------------------------
    # API — http://localhost:8081
    # -------------------------------------------------------------------------
    server {
        listen 8081;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        # SignalR hub. Buffering off and a long read timeout, or the connection
        # is torn down between messages on an idle conversation.
        location /hubs/ {
            proxy_pass http://internalchat_api;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://internalchat_api;
        }

        # T051 adds here:
        #   location /internal-attachments/ { internal; proxy_pass http://minio:9000/; }
    }

    include /etc/nginx/conf.d/*.conf;
}
