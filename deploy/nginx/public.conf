# -----------------------------------------------------------------------------
# Public edge behind a Cloudflare Tunnel — https://chat.benda.io.vn
#
# Used ONLY by deploy/docker-compose.public.yml, which mounts this file as nginx.conf in place of
# the TLS-terminating nginx.conf. Cloudflare terminates TLS at its edge and cloudflared forwards to
# http://localhost:8090 over loopback, so this listens on plain HTTP and needs no certificates.
#
# ONE origin for everything the browser touches, which is what makes the app work through a single
# public hostname:
#
#   /                 → web  (the SPA)
#   /api/  /hubs/     → api  (REST + SignalR over WebSockets)
#   /realms/ /resources/ → keycloak (sign-in pages, OIDC endpoints, their static assets)
#
# Keycloak's admin console (/admin) is deliberately NOT routed: nobody on the internet should reach
# it. Administer the realm from the host at http://localhost:${KEYCLOAK_PORT}.
# -----------------------------------------------------------------------------

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # SignalR over WebSockets. Without the upgrade the hub falls back to long polling and every
    # message arrives later (002 FR-010).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # The real client address, as Cloudflare saw it. cloudflared connects from loopback, so
    # $remote_addr is always 127.0.0.1-ish; rate limits keyed on it would throttle everyone together.
    map $http_cf_connecting_ip $client_ip {
        default $http_cf_connecting_ip;
        ''      $remote_addr;
    }

    limit_req_zone $client_ip zone=auth_limit:10m   rate=10r/m;
    limit_req_zone $client_ip zone=upload_limit:10m rate=30r/m;
    limit_req_zone $client_ip zone=api_limit:20m    rate=600r/m;
    limit_req_status 429;
    limit_conn_zone $client_ip zone=conn_limit:10m;

    # 500 MB video uploads (FR-023). Note: Cloudflare's free plan caps request bodies at 100 MB, so
    # larger uploads fail at the edge before reaching this.
    client_max_body_size 512m;
    client_body_timeout  300s;

    proxy_http_version 1.1;

    # The public origin is always HTTPS on 443, whatever this hop is. Keycloak builds its issuer and
    # redirect URLs from these (KC_PROXY_HEADERS=xforwarded), and they must say https://chat...
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $client_ip;
    proxy_set_header X-Forwarded-For   $client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;

    upstream internalchat_web {
        server web:8080;
        keepalive 16;
    }

    upstream internalchat_api {
        server api:8080;
        keepalive 32;
    }

    upstream internalchat_keycloak {
        server keycloak:8080;
        keepalive 8;
    }

    upstream internalchat_objects {
        server minio:9000;
        keepalive 16;
    }

    server {
        listen 8090;
        server_name _;

        limit_conn conn_limit 200;

        # Cloudflare already enforces HTTPS for the hostname; HSTS here tells browsers to never try
        # plain HTTP again.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "no-referrer" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain always;
            return 200 "ok\n";
        }

        # --- Keycloak: sign-in pages and OIDC endpoints ------------------------------------------
        # Keycloak sends its own CSP and framing headers for its pages, so none are added here.
        location /realms/ {
            limit_req zone=auth_limit burst=30 nodelay;
            proxy_pass http://internalchat_keycloak;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;

            # Stops Cloudflare Web Analytics injecting its beacon into the sign-in pages, where
            # Keycloak's CSP blocks it. A second Cache-Control field is merged with Keycloak's own.
            # add_header here drops the server-level ones, so they are repeated.
            add_header Cache-Control             "no-transform" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options    "nosniff" always;
            add_header Referrer-Policy           "no-referrer" always;
        }

        location /resources/ {
            proxy_pass http://internalchat_keycloak;
        }

        # --- API ---------------------------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://internalchat_api;
        }

        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;
            proxy_pass http://internalchat_api;
        }

        # SignalR hub. Buffering off and a long read timeout, or the socket is torn down between
        # messages on a quiet conversation. Cloudflare Tunnel carries WebSockets natively.
        location /hubs/ {
            proxy_pass http://internalchat_api;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Attachment bytes, reachable only via the API's X-Accel-Redirect after its membership check
        # (FR-025, research D7). Identical to nginx.conf; see the reasoning there.
        location /internal-attachments/ {
            internal;

            proxy_pass http://internalchat_objects/;
            proxy_set_header Authorization "";
            proxy_pass_request_headers off;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;

            proxy_buffering off;
            proxy_read_timeout 300s;

            add_header Cache-Control "private, no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # --- The SPA ---------------------------------------------------------------------------
        location / {
            proxy_pass http://internalchat_web;

            # add_header in a location replaces the server-level ones, so they are repeated here.
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options    "nosniff" always;
            add_header Referrer-Policy           "no-referrer" always;
            add_header X-Frame-Options           "DENY" always;
            add_header Permissions-Policy        "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;
            # Stops Cloudflare Web Analytics injecting its beacon, which script-src 'self' blocks.
            add_header Cache-Control             "no-transform" always;

            # Everything is same-origin now, Keycloak included, so 'self' covers the OIDC calls;
            # wss: is for the SignalR socket.
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self' wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        }
    }
}
