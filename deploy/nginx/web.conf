# Static serving for the React build output inside the `web` image.
# This is NOT the edge — TLS, security headers, CORS, and the attachment
# internal-redirect all live on the `nginx` reverse-proxy service
# (deploy/nginx/nginx.conf, tasks T044 and T051).

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container probe target. Must not be proxied or rewritten.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Hashed build assets are immutable — Vite fingerprints every filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy strands clients on the old
    # asset manifest.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
    }

    # SPA fallback. Client-side routes are not files on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
