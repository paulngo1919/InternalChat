# 002 FR-012 — alert when message delivery is slow for a sustained period.
#
# Written against the fan-out stage (commit → hub send), because it is the one server-side series
# that contains the whole path the reported delay lived in: outbox wait, broker hop, read-back, and
# backplane publish. The outbox stage gets its own rule so an incident says WHICH half is slow.
#
# Metric names: the collector's Prometheus exporter appends the unit suffix by default, turning
# chat.delivery.fanout_lag (unit ms) into chat_delivery_fanout_lag_milliseconds. Matched by regex so
# the rules survive that setting either way — a rule that silently matches nothing is the one
# failure an alert must not have.
#
# Where these go: Prometheus evaluates them and Grafana shows them. Routing to a person (e-mail,
# chat) needs a contact point — an Alertmanager or a Grafana contact point — which is a deployment
# decision and is not assumed here.

groups:
  - name: delivery
    rules:
      - alert: DeliveryLatencySLO
        # 002 plan budget: commit → hub send p95 150 ms. Alerting at 300 ms leaves room for noise and
        # still fires well before employees see the end-to-end p95 (300 ms) break badly.
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate({__name__=~"chat_delivery_fanout_lag(_milliseconds)?_bucket", event_type="chat.message.sent.v1"}[5m]))
          ) > 300
        for: 5m
        labels:
          severity: page
        annotations:
          summary: Message delivery is slow
          description: >
            p95 from message commit to hub send has been above 300 ms for 5 minutes (002 FR-012).
            Check OutboxLagHigh first: if it is also firing, the dispatcher or the broker is behind;
            if not, look at realtime.fanout consumer depth and the Redis backplane.

      - alert: OutboxLagHigh
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate({__name__=~"chat_delivery_outbox_lag(_milliseconds)?_bucket"}[5m]))
          ) > 100
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: Outbox dispatch is slow
          description: >
            p95 from outbox commit to broker confirm has been above 100 ms for 5 minutes. The
            dispatcher may be running on its 5 s backstop poll only — look for "Outbox listener lost
            its connection" (event 2111) in the Worker's logs.

      - alert: DeliveryOnLongPolling
        # Not an outage: a signal that a proxy is stripping WebSocket upgrades for some employees.
        expr: >
          sum({__name__=~"chat_hub_connections(_ratio)?", transport="longPolling"})
            / clamp_min(sum({__name__=~"chat_hub_connections(_ratio)?"}), 1) > 0.1
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: Over 10% of hub connections are on long polling
          description: >
            Messages reach these employees more slowly (002 SC-005). Usually a proxy or load balancer
            that does not forward the Upgrade header on /hubs/.
