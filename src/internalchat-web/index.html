<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f1923" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>InternalChat</title>
    <!--
      First-paint splash, shown before any script has loaded. It mirrors LoadingScreen
      (src/components/loading) so React replaces it with an identical tree and nothing flashes.
      Literal colours, because the theme variables arrive with the bundle. Keep in step with
      loading.css.
    -->
    <style>
      html,body{margin:0;background:#080d16}
      #root>.loading-screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(60% 50% at 50% 42%,rgba(20,184,166,.15),transparent 70%),#080d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;opacity:0;animation:ls-fade .4s ease-out .15s forwards}
      #root .loading-screen__mark{position:relative;width:96px;height:96px;display:grid;place-items:center;margin-bottom:18px}
      #root .loading-screen__orbit{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,#14b8a6 80%,#6366f1 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2px));animation:ls-spin 1.1s linear infinite}
      #root .loading-screen__logo{width:64px;height:64px;display:grid;place-items:center;border-radius:20px;background:linear-gradient(135deg,#14b8a6,#6366f1);color:#fff;box-shadow:0 10px 30px -8px #14b8a6}
      #root .loading-screen__brand{margin:0;font-size:1.25rem;font-weight:600}
      #root .loading-screen__message{margin:0;font-size:.875rem;color:#94a3b8}
      #root .loading-screen__bar{position:relative;width:160px;height:3px;margin-top:18px;overflow:hidden;border-radius:999px;background:rgba(255,255,255,.08)}
      #root .loading-screen__bar>span{position:absolute;inset:0 auto 0 0;width:40%;border-radius:inherit;background:linear-gradient(135deg,#14b8a6,#6366f1);animation:ls-slide 1.4s cubic-bezier(.65,0,.35,1) infinite}
      #root .loading-screen__dot{fill:#0d9488;transform-box:fill-box;transform-origin:center;animation:ls-dot 1.2s ease-in-out infinite}
      #root .loading-screen__dot:nth-of-type(2){animation-delay:.15s}
      #root .loading-screen__dot:nth-of-type(3){animation-delay:.3s}
      @keyframes ls-dot{0%,60%,100%{transform:translateY(0);opacity:.55}30%{transform:translateY(-2.5px);opacity:1}}
      @keyframes ls-fade{to{opacity:1}}
      @keyframes ls-spin{to{transform:rotate(360deg)}}
      @keyframes ls-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      @media (prefers-reduced-motion:reduce){#root .loading-screen__orbit,#root .loading-screen__bar>span,#root .loading-screen__dot{animation:none}#root .loading-screen__bar>span{width:100%;opacity:.5}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-screen">
        <div class="loading-screen__mark" aria-hidden="true">
          <span class="loading-screen__orbit"></span>
          <span class="loading-screen__logo">
            <svg viewBox="0 0 32 32" width="34" height="34" fill="none" focusable="false"><path d="M16 5c-6.35 0-11.5 4.37-11.5 9.75 0 2.9 1.5 5.5 3.88 7.28L7.5 27l5.2-2.7c1.05.28 2.16.45 3.3.45 6.35 0 11.5-4.37 11.5-9.75S22.35 5 16 5z" fill="currentColor" /><circle class="loading-screen__dot" cx="11" cy="14.75" r="1.9" /><circle class="loading-screen__dot" cx="16" cy="14.75" r="1.9" /><circle class="loading-screen__dot" cx="21" cy="14.75" r="1.9" /></svg>
          </span>
        </div>
        <p class="loading-screen__brand">InternalChat</p>
        <p class="loading-screen__message" role="status" aria-live="polite">Loading…</p>
        <div class="loading-screen__bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
